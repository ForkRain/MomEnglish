<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#a5d6a7">
<title>엄마 영어 단어장</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    /* 연한 초록 테마 */
    --bg: #edf7e9;
    --card: #ffffff;
    --ink: #1f3324;
    --muted: #5d7462;
    --line: #cde5c5;
    --accent: #43a05a;
    --accent-ink: #ffffff;
    --done: #1b7a3a;
    --done-bg: #d2efd6;
    --review: #ea580c;
    --review-bg: #ffedd5;
    --none-bg: #deedd8;
    --wrong: #dc2626;
    --dot: #b9d6b1;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, "Noto Sans KR", "Malgun Gothic", sans-serif;
    font-size: 20px;
    line-height: 1.4;
  }
  button { font: inherit; color: inherit; border: 0; cursor: pointer; }
  [hidden] { display: none !important; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 16px 16px 40px; }

  /* ---------- 홈 ---------- */
  .title { font-size: 30px; font-weight: 800; margin: 8px 0 4px; }
  .summary { color: var(--muted); margin: 0 0 16px; font-size: 19px; }
  .summary b.d { color: var(--done); }
  .summary b.r { color: var(--review); }
  .review-all {
    width: 100%; padding: 16px; border-radius: 16px; margin-bottom: 16px;
    background: var(--review); color: #fff; font-size: 22px; font-weight: 700;
  }
  .legend { display: flex; gap: 14px; font-size: 16px; color: var(--muted); margin-bottom: 14px; flex-wrap: wrap; }
  .legend span::before { content: "●"; margin-right: 4px; }
  .legend .ld::before { color: var(--done); }
  .legend .lr::before { color: var(--review); }
  .legend .ln::before { color: var(--dot); }
  .chapter { background: var(--card); border: 2px solid var(--line); border-radius: 20px; padding: 16px; margin-bottom: 14px; }
  .ch-head { display: flex; align-items: center; gap: 12px; }
  .ch-emoji { font-size: 40px; }
  .ch-name { flex: 1; }
  .ch-name .n { font-size: 16px; color: var(--muted); }
  .ch-name .t { font-size: 24px; font-weight: 800; }
  .ch-start { background: var(--accent); color: var(--accent-ink); font-weight: 800; padding: 12px 18px; border-radius: 14px; }
  .bar { height: 10px; background: var(--none-bg); border-radius: 99px; overflow: hidden; margin: 14px 0 6px; display: flex; }
  .bar .d { background: var(--done); }
  .bar .r { background: var(--review); }
  .ch-count { font-size: 16px; color: var(--muted); }
  .chapter.all-done { border-color: var(--done); background: var(--done-bg); }
  .sec { font-size: 22px; margin: 24px 4px 10px; }
  .sec small { font-size: 16px; color: var(--muted); font-weight: 600; }

  /* ---------- 공통 상단 ---------- */
  .screen { display: flex; flex-direction: column; min-height: 100dvh; }
  .top { display: flex; align-items: center; gap: 8px; padding: 12px 16px; max-width: 560px; width: 100%; margin: 0 auto; }
  .back { background: var(--card); border: 2px solid var(--line); padding: 10px 14px; border-radius: 14px; font-weight: 700; }
  .top .where { flex: 1; text-align: center; font-weight: 800; }
  .top .pos { font-weight: 800; color: var(--muted); min-width: 64px; text-align: right; }
  .stage { flex: 1; display: flex; flex-direction: column; padding: 0 16px 16px; max-width: 560px; width: 100%; margin: 0 auto; }

  /* ---------- 배움 (플래시카드) ---------- */
  .card {
    flex: 1; background: var(--card); border: 3px solid var(--line); border-radius: 28px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 24px 16px; touch-action: pan-y; user-select: none;
    transition: transform .15s ease, opacity .15s ease; min-height: 380px;
  }
  .w-emoji { font-size: 64px; line-height: 1; margin-bottom: 12px; }
  .w-ko { font-size: 36px; font-weight: 700; color: var(--muted); }
  .w-en { font-size: 60px; font-weight: 900; margin: 6px 0; word-break: break-word; line-height: 1.15; }
  .w-pr { font-size: 32px; font-weight: 700; color: var(--accent); }
  .speak { margin-top: 22px; background: var(--accent); color: var(--accent-ink); font-size: 22px; font-weight: 800; padding: 14px 26px; border-radius: 99px; }
  .nav { display: flex; gap: 10px; margin-top: 14px; }
  .nav button { flex: 1; padding: 18px 8px; border-radius: 16px; font-size: 22px; font-weight: 800; background: var(--ink); color: #fff; }
  .nav button:disabled { opacity: .25; }
  .quiz-go { margin-top: 28px; padding-top: 18px; border-top: 2px dashed var(--line); text-align: center; }
  .qg-text { color: var(--muted); font-size: 17px; margin-bottom: 10px; }
  .quiz-go button { width: 100%; padding: 18px; border-radius: 16px; font-size: 24px; font-weight: 800; background: var(--done); color: #fff; }
  .dots { display: flex; justify-content: center; gap: 6px; margin-top: 12px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--dot); }
  .dot.now { background: var(--ink); transform: scale(1.3); }
  .hint { text-align: center; color: var(--muted); font-size: 15px; margin-top: 8px; }

  /* ---------- 퀴즈 ---------- */
  .q-box { background: var(--card); border: 3px solid var(--line); border-radius: 28px; text-align: center; padding: 24px 16px; }
  .q-ask { color: var(--muted); font-size: 18px; }
  .q-en { font-size: 56px; font-weight: 900; margin: 8px 0; word-break: break-word; line-height: 1.15; }
  .q-box .speak { margin-top: 6px; padding: 10px 22px; font-size: 20px; }
  .choices { display: grid; gap: 10px; margin-top: 14px; }
  .choice { padding: 18px 12px; border-radius: 18px; font-size: 26px; font-weight: 800; background: var(--card); border: 3px solid var(--line); }
  .choice.right { background: var(--done); border-color: var(--done); color: #fff; }
  .choice.wrong { background: var(--wrong); border-color: var(--wrong); color: #fff; }
  .feedback { text-align: center; font-size: 24px; font-weight: 800; min-height: 40px; margin-top: 12px; }
  .feedback.ok { color: var(--done); }
  .feedback.no { color: var(--wrong); }

  /* ---------- 결과 ---------- */
  .result { text-align: center; padding-top: 24px; }
  .r-big { font-size: 64px; }
  .r-score { font-size: 32px; font-weight: 900; margin: 8px 0 4px; }
  .r-sub { color: var(--muted); }
  .r-list { text-align: left; background: var(--card); border: 2px solid var(--line); border-radius: 20px; padding: 8px 16px; margin: 20px 0; }
  .r-item { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .r-item:last-child { border-bottom: 0; }
  .r-left { min-width: 0; }
  .r-en { font-size: 24px; font-weight: 900; word-break: break-word; }
  .r-note { font-size: 14px; font-weight: 700; margin-top: 2px; }
  .r-note.no { color: var(--wrong); }
  .r-note.ok { color: var(--muted); }
  .r-note.done { color: var(--done); }
  .r-right { text-align: right; flex-shrink: 0; max-width: 50%; }
  .r-pr { font-size: 20px; font-weight: 800; color: var(--accent); }
  .r-ko { font-size: 18px; color: var(--ink); }
  .btn { display: block; width: 100%; padding: 18px; border-radius: 16px; font-size: 22px; font-weight: 800; margin-top: 10px; }
  .btn.main { background: var(--review); color: #fff; }
  .btn.alt { background: var(--ink); color: #fff; }
  .btn.plain { background: var(--card); border: 2px solid var(--line); }

  /* ---------- 백업 ---------- */
  .backup-box { background: var(--card); border: 2px solid var(--line); border-radius: 20px; padding: 16px; }
  .backup-box p { margin: 0 0 6px; color: var(--muted); font-size: 17px; }
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: flex-end; justify-content: center; z-index: 10; }
  .sheet { background: var(--bg); width: 100%; max-width: 560px; border-radius: 24px 24px 0 0; padding: 20px 16px 24px; max-height: 92dvh; overflow-y: auto; }
  .sheet h3 { margin: 0 0 8px; font-size: 24px; }
  .sheet p { margin: 0 0 10px; font-size: 17px; color: var(--muted); }
  .sheet textarea { width: 100%; font: 14px/1.4 monospace; padding: 10px; border-radius: 12px; border: 2px solid var(--line); background: var(--card); color: var(--ink); resize: vertical; word-break: break-all; }
  .msg { text-align: center; font-weight: 800; font-size: 19px; min-height: 28px; margin-top: 10px; }
  .msg.ok { color: var(--done); }
  .msg.no { color: var(--wrong); }
</style>
</head>
<body>

<!-- 홈 화면 -->
<main id="home" class="wrap">
  <h1 class="title">엄마 영어 단어장 🌼</h1>
  <p class="summary" id="summary"></p>
  <button class="review-all" id="reviewAll" hidden></button>
  <div class="legend">
    <span class="ld">연습 완료</span><span class="lr">복습 필요</span><span class="ln">아직 안 함</span>
  </div>
  <div id="chapters"></div>

  <h2 class="sec">💾 공부 기록 지키기</h2>
  <div class="backup-box">
    <p>폰을 바꾸거나 기록이 지워졌을 때를 대비해서, 가끔 백업해서 카톡 등에 보관해 두세요.</p>
    <button class="btn alt" id="openBackup">📤 기록 백업하기</button>
    <button class="btn plain" id="openRestore">📥 기록 불러오기</button>
  </div>
</main>

<!-- 백업 / 불러오기 창 -->
<div class="modal" id="modal" hidden>
  <div class="sheet">
    <div id="backupPane">
      <h3>📤 기록 백업</h3>
      <p id="backupInfo"></p>
      <textarea id="backupCode" readonly rows="4"></textarea>
      <button class="btn main" id="shareBackup">카톡 등으로 보내기</button>
      <button class="btn alt" id="copyBackup">백업 글자 복사하기</button>
    </div>
    <div id="restorePane">
      <h3>📥 기록 불러오기</h3>
      <p>보관해 둔 백업 글자를 아래 칸에 붙여넣고 "불러오기"를 눌러주세요.<br><b>지금 폰에 있는 기록은 백업 내용으로 바뀌어요.</b></p>
      <textarea id="restoreCode" rows="4" placeholder="여기를 꾹 눌러서 붙여넣기"></textarea>
      <button class="btn main" id="doRestore">불러오기</button>
    </div>
    <div class="msg" id="modalMsg"></div>
    <button class="btn plain" id="closeModal">닫기</button>
  </div>
</div>

<!-- 배움 화면 (플래시카드) -->
<section id="learn" class="screen" hidden>
  <div class="top">
    <button class="back" data-home>← 처음</button>
    <div class="where" id="where"></div>
    <div class="pos" id="pos"></div>
  </div>
  <div class="stage">
    <div class="card" id="card">
      <div class="w-emoji" id="wEmoji"></div>
      <div class="w-ko" id="wKo"></div>
      <div class="w-en" id="wEn"></div>
      <div class="w-pr" id="wPr"></div>
      <button class="speak" id="speak">🔊 소리 듣기</button>
    </div>
    <div class="nav">
      <button id="prev">◀ 이전</button>
      <button id="next">다음 ▶</button>
    </div>
    <div class="dots" id="dots"></div>
    <div class="hint" id="hint">카드를 왼쪽·오른쪽으로 밀어도 넘어가요</div>
    <div class="quiz-go" id="quizGo" hidden>
      <div class="qg-text">10개 단어를 다 봤어요! 준비되면 눌러주세요 👇</div>
      <button id="startQuiz">✏️ 퀴즈 풀기</button>
    </div>
  </div>
</section>

<!-- 퀴즈 화면 -->
<section id="quiz" class="screen" hidden>
  <div class="top">
    <button class="back" data-home>← 처음</button>
    <div class="where">퀴즈</div>
    <div class="pos" id="qPos"></div>
  </div>
  <div class="stage">
    <div class="q-box">
      <div class="q-ask">이 단어의 뜻은?</div>
      <div class="q-en" id="qEn"></div>
      <button class="speak" id="qSpeak">🔊 소리 듣기</button>
    </div>
    <div class="choices" id="choices"></div>
    <div class="feedback" id="feedback"></div>
  </div>
</section>

<!-- 결과 화면 -->
<section id="result" class="screen" hidden>
  <div class="stage result">
    <div class="r-big" id="rBig"></div>
    <div class="r-score" id="rScore"></div>
    <div class="r-sub">퀴즈에서 <b>4번 연속</b> 맞힌 단어만 <b style="color:var(--done)">연습 완료</b>가 돼요.<br>틀리면 처음부터 다시 세요.</div>
    <div class="r-list" id="rList"></div>
    <button class="btn main" id="rRetry">🔁 틀린 단어 다시 공부하기</button>
    <button class="btn alt" data-home>처음 화면으로</button>
  </div>
</section>

<script src="words.js"></script>
<script>
  // ---------- 저장 ----------
  const KEY = "momEnglish.status.v1";
  let status = {};
  try { status = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { status = {}; }
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(status)); } catch (e) {} };
  // 단어별 기록: { s: "done" | "review", n: 연속으로 맞힌 횟수 }
  const NEED = 4; // 이만큼 연속으로 맞히면 연습 완료
  for (const k in status) { // 예전 형식("done"/"review") 변환
    if (typeof status[k] === "string") status[k] = { s: status[k], n: status[k] === "done" ? NEED : 0 };
  }
  const stOf = (en) => (status[en] && status[en].s) || "";
  const nOf = (en) => (status[en] && status[en].n) || 0;

  const ALL = CHAPTERS.flatMap((c, ci) => c.words.map(w => ({ ko: w[0], en: w[1], pr: w[2], em: w[3], ci })));
  const $ = (id) => document.getElementById(id);
  const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

  // ---------- 화면 전환 ----------
  const SCREENS = ["home", "learn", "quiz", "result"];
  let inside = false; // 홈이 아닌 화면에 있는지 (폰 뒤로가기 처리용)
  function show(name) {
    SCREENS.forEach(s => $(s).hidden = s !== name);
    window.scrollTo(0, 0);
    if (name !== "home" && !inside) { history.pushState({ inside: true }, ""); inside = true; }
  }
  function goHome() {
    if (window.speechSynthesis) speechSynthesis.cancel();
    clearTimeout(quizTimer);
    show("home");
    renderHome();
  }
  document.addEventListener("click", (e) => {
    if (e.target.closest("[data-home]")) { if (inside) history.back(); else goHome(); }
  });
  window.addEventListener("popstate", () => { inside = false; goHome(); });

  // ---------- 홈 ----------
  function renderHome() {
    const done = ALL.filter(w => stOf(w.en) === "done").length;
    const review = ALL.filter(w => stOf(w.en) === "review").length;
    $("summary").innerHTML = `전체 ${ALL.length}개 · <b class="d">완료 ${done}</b> · <b class="r">복습 ${review}</b>`;
    $("reviewAll").hidden = review === 0;
    $("reviewAll").textContent = review <= 10
      ? `🔁 복습 필요 단어 ${review}개 공부하기`
      : `🔁 복습 필요 단어 공부하기 (${review}개 중 10개씩)`;

    $("chapters").innerHTML = CHAPTERS.map((c, i) => {
      const d = c.words.filter(w => stOf(w[1]) === "done").length;
      const r = c.words.filter(w => stOf(w[1]) === "review").length;
      const head = i === 0 ? `<h2 class="sec">✈️ 여행 영어 <small>1~10장</small></h2>`
                 : i === 10 ? `<h2 class="sec">📘 기초 단어 <small>11~50장</small></h2>` : "";
      return `${head}
        <div class="chapter${d === 10 ? " all-done" : ""}">
          <div class="ch-head">
            <div class="ch-emoji">${c.emoji}</div>
            <div class="ch-name"><div class="n">${i + 1}장</div><div class="t">${c.title}</div></div>
            <button class="ch-start" data-ch="${i}">시작</button>
          </div>
          <div class="bar"><div class="d" style="width:${d * 10}%"></div><div class="r" style="width:${r * 10}%"></div></div>
          <div class="ch-count">${d === 10 ? "🎉 모두 완료!" : `완료 ${d} · 복습 ${r} · 아직 ${10 - d - r}`}</div>
        </div>`;
    }).join("");
  }
  $("chapters").addEventListener("click", (e) => {
    const b = e.target.closest("[data-ch]");
    if (b) { const ci = +b.dataset.ch; openLearn(ALL.filter(w => w.ci === ci), `${ci + 1}장 ${CHAPTERS[ci].title}`); }
  });
  $("reviewAll").addEventListener("click", () => {
    // 연속 정답 수가 적은 단어부터 10개씩
    const list = ALL.filter(w => stOf(w.en) === "review").sort((a, b) => nOf(a.en) - nOf(b.en)).slice(0, 10);
    if (list.length) openLearn(list, "복습 단어");
  });

  // ---------- 배움 (플래시카드) ----------
  let deck = [], idx = 0;
  function openLearn(list, name) {
    deck = list; idx = 0;
    $("where").textContent = name;
    show("learn");
    renderCard();
  }
  function renderCard() {
    const w = deck[idx];
    $("wEmoji").textContent = w.em;
    $("wKo").textContent = w.ko;
    $("wEn").textContent = w.en;
    $("wPr").textContent = `[ ${w.pr} ]`;
    $("pos").textContent = `${idx + 1} / ${deck.length}`;
    $("prev").disabled = idx === 0;
    // 마지막 카드: "다음"은 멈추고, 퀴즈 버튼은 아래쪽 다른 자리에 따로 보여줌 (실수로 바로 퀴즈로 가지 않게)
    const last = idx === deck.length - 1;
    $("next").disabled = last;
    $("quizGo").hidden = !last;
    $("hint").hidden = last;
    $("quizGo").querySelector(".qg-text").textContent = `${deck.length}개 단어를 다 봤어요! 준비되면 눌러주세요 👇`;
    $("dots").innerHTML = deck.length <= 20
      ? deck.map((_, i) => `<span class="dot ${i === idx ? "now" : ""}"></span>`).join("") : "";
  }
  function move(step) {
    const n = idx + step;
    if (n < 0) return;
    if (n >= deck.length) return;
    const card = $("card");
    card.style.opacity = "0";
    card.style.transform = `translateX(${step > 0 ? -40 : 40}px)`;
    setTimeout(() => {
      idx = n; renderCard();
      card.style.transition = "none";
      card.style.transform = `translateX(${step > 0 ? 40 : -40}px)`;
      requestAnimationFrame(() => requestAnimationFrame(() => {
        card.style.transition = "";
        card.style.opacity = "1";
        card.style.transform = "";
      }));
    }, 150);
  }
  $("prev").addEventListener("click", () => move(-1));
  $("next").addEventListener("click", () => move(1));
  $("startQuiz").addEventListener("click", () => startQuiz());

  let sx = null, sy = null;
  $("card").addEventListener("touchstart", (e) => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
  $("card").addEventListener("touchend", (e) => {
    if (sx === null) return;
    const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    sx = null;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) {
      if (dx < 0 && idx === deck.length - 1) return; // 마지막 카드에서는 버튼으로만 퀴즈 시작
      move(dx < 0 ? 1 : -1);
    }
  });

  // ---------- 소리 ----------
  // 실제 사람 녹음(audio 폴더)이 있으면 그걸 틀고, 없을 때만 폰 음성으로 읽기
  let player = null;
  function speak(text) {
    const file = (window.AUDIO || {})[text];
    if (player) { player.pause(); player = null; }
    if (window.speechSynthesis) speechSynthesis.cancel();
    if (file) {
      player = new Audio(file);
      player.play().catch(() => tts(text));
      return;
    }
    tts(text);
  }
  function tts(text) {
    if (!("speechSynthesis" in window)) { alert("이 폰에서는 소리 기능을 쓸 수 없어요."); return; }
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "en-US"; u.rate = 0.75;
    const v = speechSynthesis.getVoices().find(v => v.lang && v.lang.replace("_", "-").startsWith("en-US"))
           || speechSynthesis.getVoices().find(v => v.lang && v.lang.startsWith("en"));
    if (v) u.voice = v;
    speechSynthesis.speak(u);
  }
  $("speak").addEventListener("click", () => speak(deck[idx].en));

  // ---------- 퀴즈 ----------
  let qList = [], qi = 0, results = [], quizTimer = null, locked = false;
  function startQuiz() {
    qList = shuffle(deck); qi = 0; results = [];
    show("quiz");
    renderQuestion();
  }
  function renderQuestion() {
    locked = false;
    const w = qList[qi];
    $("qPos").textContent = `${qi + 1} / ${qList.length}`;
    $("qEn").textContent = w.en;
    $("feedback").textContent = ""; $("feedback").className = "feedback";
    // 오답 보기: 같은 챕터에서 먼저 고르고, 모자라면 전체에서
    const pool = shuffle(ALL.filter(x => x.en !== w.en && x.ci === w.ci))
      .concat(shuffle(ALL.filter(x => x.en !== w.en && x.ci !== w.ci)));
    const opts = shuffle([w, ...pool.slice(0, 3)]);
    $("choices").innerHTML = opts.map(o => `<button class="choice" data-en="${o.en}">${o.ko}</button>`).join("");
  }
  $("qSpeak").addEventListener("click", () => speak(qList[qi].en));
  $("choices").addEventListener("click", (e) => {
    const b = e.target.closest(".choice");
    if (!b || locked) return;
    locked = true;
    const w = qList[qi];
    const ok = b.dataset.en === w.en;
    const n = ok ? Math.min(nOf(w.en) + 1, NEED) : 0;
    status[w.en] = { s: n >= NEED ? "done" : "review", n };
    save();
    results.push({ w, ok, n });
    $("choices").querySelectorAll(".choice").forEach(c => { if (c.dataset.en === w.en) c.classList.add("right"); });
    if (!ok) b.classList.add("wrong");
    $("feedback").className = "feedback " + (ok ? "ok" : "no");
    $("feedback").textContent = !ok ? `❌ 정답은 '${w.ko}' 예요`
      : n >= NEED ? "🎉 맞았어요! 연습 완료!" : `⭕ 맞았어요! (연속 ${n}/${NEED})`;
    quizTimer = setTimeout(() => {
      qi++;
      if (qi < qList.length) renderQuestion(); else showResult();
    }, ok ? 1000 : 2000);
  });

  // ---------- 결과 ----------
  function showResult() {
    const right = results.filter(r => r.ok).length;
    const total = results.length;
    $("rBig").textContent = right === total ? "🎉" : right >= total / 2 ? "👍" : "💪";
    $("rScore").textContent = `${total}개 중 ${right}개 맞았어요!`;
    // 왼쪽: 영어 단어 (+ 결과), 오른쪽: 한글 발음과 뜻
    $("rList").innerHTML = results.map(r => {
      const cls = !r.ok ? "no" : r.n >= NEED ? "done" : "ok";
      const note = !r.ok ? "❌ 틀림 · 처음부터 다시" : r.n >= NEED ? "✅ 연습 완료!" : `⭕ 맞음 · 연속 ${r.n}/${NEED}`;
      return `<div class="r-item">
        <div class="r-left"><div class="r-en">${r.w.en}</div><div class="r-note ${cls}">${note}</div></div>
        <div class="r-right"><div class="r-pr">${r.w.pr}</div><div class="r-ko">${r.w.ko}</div></div>
      </div>`;
    }).join("");
    const left = results.filter(r => r.n < NEED).map(r => r.w);
    $("rRetry").hidden = left.length === 0;
    $("rRetry").textContent = `🔁 아직 완료 안 된 단어 ${left.length}개 다시 공부하기`;
    $("rRetry").onclick = () => openLearn(left, "다시 공부");
    show("result");
  }

  // ---------- 백업 / 불러오기 ----------
  // 백업 글자 = "MOMENG1-" + base64({영어단어: 연속정답수})  (기록이 있는 단어는 복습 필요, 4 이상이면 완료)
  const PREFIX = "MOMENG1-";
  function makeBackup() {
    const data = {};
    for (const en in status) data[en] = status[en].n;
    return PREFIX + btoa(unescape(encodeURIComponent(JSON.stringify(data))));
  }
  function readBackup(text) {
    const m = (text || "").replace(/\s+/g, "").match(/MOMENG1-([A-Za-z0-9+/=]+)/);
    if (!m) return null;
    try {
      const data = JSON.parse(decodeURIComponent(escape(atob(m[1]))));
      const out = {};
      for (const en in data) {
        const n = Math.max(0, Math.min(NEED, parseInt(data[en], 10) || 0));
        out[en] = { s: n >= NEED ? "done" : "review", n };
      }
      return out;
    } catch (e) { return null; }
  }
  function countOf(st) {
    const v = Object.values(st);
    return { done: v.filter(x => x.s === "done").length, review: v.filter(x => x.s === "review").length };
  }
  function openModal(which) {
    $("backupPane").hidden = which !== "backup";
    $("restorePane").hidden = which !== "restore";
    $("modalMsg").textContent = ""; $("modalMsg").className = "msg";
    if (which === "backup") {
      const c = countOf(status);
      $("backupInfo").textContent = `완료 ${c.done}개 · 복습 ${c.review}개 기록을 아래 글자로 만들었어요. 카톡 '나에게 보내기' 등에 보관하세요.`;
      $("backupCode").value = makeBackup();
    } else {
      $("restoreCode").value = "";
    }
    $("modal").hidden = false;
  }
  function modalMsg(text, ok) { $("modalMsg").textContent = text; $("modalMsg").className = "msg " + (ok ? "ok" : "no"); }
  $("openBackup").addEventListener("click", () => openModal("backup"));
  $("openRestore").addEventListener("click", () => openModal("restore"));
  $("closeModal").addEventListener("click", () => { $("modal").hidden = true; });
  $("modal").addEventListener("click", (e) => { if (e.target === $("modal")) $("modal").hidden = true; });

  async function copyText(t) {
    try { await navigator.clipboard.writeText(t); return true; }
    catch (e) { $("backupCode").select(); try { return document.execCommand("copy"); } catch (e2) { return false; } }
  }
  $("copyBackup").addEventListener("click", async () => {
    modalMsg(await copyText($("backupCode").value) ? "✅ 복사했어요! 카톡에 붙여넣어 보관하세요." : "복사가 안 됐어요. 글자를 꾹 눌러서 직접 복사해 주세요.", true);
  });
  $("shareBackup").addEventListener("click", async () => {
    const d = new Date();
    const text = `엄마 영어 단어장 기록 백업 (${d.getFullYear()}.${d.getMonth() + 1}.${d.getDate()})\n${$("backupCode").value}`;
    if (navigator.share) {
      try { await navigator.share({ text }); modalMsg("✅ 보냈어요!", true); } catch (e) { /* 취소 */ }
    } else {
      modalMsg(await copyText(text) ? "✅ 복사했어요! 카톡에 붙여넣어 보관하세요." : "복사가 안 됐어요. 글자를 꾹 눌러서 직접 복사해 주세요.", true);
    }
  });
  $("doRestore").addEventListener("click", () => {
    const data = readBackup($("restoreCode").value);
    if (!data) { modalMsg("❌ 백업 글자가 아니에요. 'MOMENG1-'로 시작하는 글자를 통째로 붙여넣어 주세요.", false); return; }
    const c = countOf(data);
    if (!confirm(`완료 ${c.done}개 · 복습 ${c.review}개 기록으로 바꿀까요?\n지금 폰에 있는 기록은 없어져요.`)) return;
    status = data; save(); renderHome();
    modalMsg(`✅ 불러왔어요! 완료 ${c.done}개 · 복습 ${c.review}개`, true);
  });

  renderHome();

  // 오프라인 사용 (https 또는 localhost 에서만 동작)
  if ("serviceWorker" in navigator && window.isSecureContext) {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }
</script>
</body>
</html>
