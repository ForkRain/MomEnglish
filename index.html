<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f59e0b">
<title>엄마 여행 영어</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    --bg: #fffaf0;
    --card: #ffffff;
    --ink: #2b2118;
    --muted: #7a6a5a;
    --line: #eadfce;
    --accent: #f59e0b;
    --accent-ink: #ffffff;
    --done: #16a34a;
    --done-bg: #dcfce7;
    --review: #ea580c;
    --review-bg: #ffedd5;
    --none-bg: #f3ede4;
    --wrong: #dc2626;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, "Noto Sans KR", "Malgun Gothic", sans-serif;
    font-size: 20px;
    line-height: 1.4;
  }
  button { font: inherit; color: inherit; border: 0; cursor: pointer; }
  [hidden] { display: none !important; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 16px 16px 40px; }

  /* ---------- 홈 ---------- */
  .title { font-size: 30px; font-weight: 800; margin: 8px 0 4px; }
  .summary { color: var(--muted); margin: 0 0 16px; font-size: 19px; }
  .summary b.d { color: var(--done); }
  .summary b.r { color: var(--review); }
  .review-all {
    width: 100%; padding: 16px; border-radius: 16px; margin-bottom: 16px;
    background: var(--review); color: #fff; font-size: 22px; font-weight: 700;
  }
  .legend { display: flex; gap: 14px; font-size: 16px; color: var(--muted); margin-bottom: 14px; flex-wrap: wrap; }
  .legend span::before { content: "●"; margin-right: 4px; }
  .legend .ld::before { color: var(--done); }
  .legend .lr::before { color: var(--review); }
  .legend .ln::before { color: #cbbfae; }
  .chapter { background: var(--card); border: 2px solid var(--line); border-radius: 20px; padding: 16px; margin-bottom: 14px; }
  .ch-head { display: flex; align-items: center; gap: 12px; }
  .ch-emoji { font-size: 40px; }
  .ch-name { flex: 1; }
  .ch-name .n { font-size: 16px; color: var(--muted); }
  .ch-name .t { font-size: 24px; font-weight: 800; }
  .ch-start { background: var(--accent); color: var(--accent-ink); font-weight: 800; padding: 12px 18px; border-radius: 14px; }
  .bar { height: 10px; background: var(--none-bg); border-radius: 99px; overflow: hidden; margin: 14px 0 6px; display: flex; }
  .bar .d { background: var(--done); }
  .bar .r { background: var(--review); }
  .ch-count { font-size: 16px; color: var(--muted); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chip { font-size: 16px; padding: 4px 10px; border-radius: 99px; background: var(--none-bg); }
  .chip.done { background: var(--done-bg); color: var(--done); font-weight: 700; }
  .chip.review { background: var(--review-bg); color: var(--review); font-weight: 700; }

  /* ---------- 공통 상단 ---------- */
  .screen { display: flex; flex-direction: column; min-height: 100dvh; }
  .top { display: flex; align-items: center; gap: 8px; padding: 12px 16px; max-width: 560px; width: 100%; margin: 0 auto; }
  .back { background: var(--card); border: 2px solid var(--line); padding: 10px 14px; border-radius: 14px; font-weight: 700; }
  .top .where { flex: 1; text-align: center; font-weight: 800; }
  .top .pos { font-weight: 800; color: var(--muted); min-width: 64px; text-align: right; }
  .stage { flex: 1; display: flex; flex-direction: column; padding: 0 16px 16px; max-width: 560px; width: 100%; margin: 0 auto; }

  /* ---------- 배움 (플래시카드) ---------- */
  .card {
    flex: 1; background: var(--card); border: 3px solid var(--line); border-radius: 28px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 24px 16px; touch-action: pan-y; user-select: none;
    transition: transform .15s ease, opacity .15s ease; min-height: 380px;
  }
  .w-emoji { font-size: 64px; line-height: 1; margin-bottom: 12px; }
  .w-ko { font-size: 36px; font-weight: 700; color: var(--muted); }
  .w-en { font-size: 60px; font-weight: 900; margin: 6px 0; word-break: break-word; line-height: 1.15; }
  .w-pr { font-size: 32px; font-weight: 700; color: var(--accent); }
  .speak { margin-top: 22px; background: var(--accent); color: var(--accent-ink); font-size: 22px; font-weight: 800; padding: 14px 26px; border-radius: 99px; }
  .nav { display: flex; gap: 10px; margin-top: 14px; }
  .nav button { flex: 1; padding: 18px 8px; border-radius: 16px; font-size: 22px; font-weight: 800; background: var(--ink); color: #fff; }
  .nav button:disabled { opacity: .25; }
  .nav button.go { background: var(--done); }
  .dots { display: flex; justify-content: center; gap: 6px; margin-top: 12px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #d8ccbb; }
  .dot.now { background: var(--ink); transform: scale(1.3); }
  .hint { text-align: center; color: var(--muted); font-size: 15px; margin-top: 8px; }

  /* ---------- 퀴즈 ---------- */
  .q-box { background: var(--card); border: 3px solid var(--line); border-radius: 28px; text-align: center; padding: 24px 16px; }
  .q-ask { color: var(--muted); font-size: 18px; }
  .q-en { font-size: 56px; font-weight: 900; margin: 8px 0; word-break: break-word; line-height: 1.15; }
  .q-box .speak { margin-top: 6px; padding: 10px 22px; font-size: 20px; }
  .choices { display: grid; gap: 10px; margin-top: 14px; }
  .choice { padding: 18px 12px; border-radius: 18px; font-size: 26px; font-weight: 800; background: var(--card); border: 3px solid var(--line); }
  .choice.right { background: var(--done); border-color: var(--done); color: #fff; }
  .choice.wrong { background: var(--wrong); border-color: var(--wrong); color: #fff; }
  .feedback { text-align: center; font-size: 24px; font-weight: 800; min-height: 40px; margin-top: 12px; }
  .feedback.ok { color: var(--done); }
  .feedback.no { color: var(--wrong); }

  /* ---------- 결과 ---------- */
  .result { text-align: center; padding-top: 24px; }
  .r-big { font-size: 64px; }
  .r-score { font-size: 32px; font-weight: 900; margin: 8px 0 4px; }
  .r-sub { color: var(--muted); }
  .r-list { text-align: left; background: var(--card); border: 2px solid var(--line); border-radius: 20px; padding: 8px 16px; margin: 20px 0; }
  .r-item { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .r-item:last-child { border-bottom: 0; }
  .r-item .mk { font-size: 24px; }
  .r-item .tx { flex: 1; }
  .r-item .tx b { font-size: 22px; }
  .r-item .tx span { color: var(--muted); }
  .btn { display: block; width: 100%; padding: 18px; border-radius: 16px; font-size: 22px; font-weight: 800; margin-top: 10px; }
  .btn.main { background: var(--review); color: #fff; }
  .btn.alt { background: var(--ink); color: #fff; }
</style>
</head>
<body>

<!-- 홈 화면 -->
<main id="home" class="wrap">
  <h1 class="title">엄마 여행 영어 ✈️</h1>
  <p class="summary" id="summary"></p>
  <button class="review-all" id="reviewAll" hidden></button>
  <div class="legend">
    <span class="ld">연습 완료</span><span class="lr">복습 필요</span><span class="ln">아직 안 함</span>
  </div>
  <div id="chapters"></div>
</main>

<!-- 배움 화면 (플래시카드) -->
<section id="learn" class="screen" hidden>
  <div class="top">
    <button class="back" data-home>← 처음</button>
    <div class="where" id="where"></div>
    <div class="pos" id="pos"></div>
  </div>
  <div class="stage">
    <div class="card" id="card">
      <div class="w-emoji" id="wEmoji"></div>
      <div class="w-ko" id="wKo"></div>
      <div class="w-en" id="wEn"></div>
      <div class="w-pr" id="wPr"></div>
      <button class="speak" id="speak">🔊 소리 듣기</button>
    </div>
    <div class="nav">
      <button id="prev">◀ 이전</button>
      <button id="next">다음 ▶</button>
    </div>
    <div class="dots" id="dots"></div>
    <div class="hint">카드를 왼쪽·오른쪽으로 밀어도 넘어가요</div>
  </div>
</section>

<!-- 퀴즈 화면 -->
<section id="quiz" class="screen" hidden>
  <div class="top">
    <button class="back" data-home>← 처음</button>
    <div class="where">퀴즈</div>
    <div class="pos" id="qPos"></div>
  </div>
  <div class="stage">
    <div class="q-box">
      <div class="q-ask">이 단어의 뜻은?</div>
      <div class="q-en" id="qEn"></div>
      <button class="speak" id="qSpeak">🔊 소리 듣기</button>
    </div>
    <div class="choices" id="choices"></div>
    <div class="feedback" id="feedback"></div>
  </div>
</section>

<!-- 결과 화면 -->
<section id="result" class="screen" hidden>
  <div class="stage result">
    <div class="r-big" id="rBig"></div>
    <div class="r-score" id="rScore"></div>
    <div class="r-sub">맞힌 단어는 <b style="color:var(--done)">연습 완료</b>, 틀린 단어는 <b style="color:var(--review)">복습 필요</b>로 표시했어요</div>
    <div class="r-list" id="rList"></div>
    <button class="btn main" id="rRetry">🔁 틀린 단어 다시 공부하기</button>
    <button class="btn alt" data-home>처음 화면으로</button>
  </div>
</section>

<script src="words.js"></script>
<script>
  // ---------- 저장 ----------
  const KEY = "momEnglish.status.v1";
  let status = {};
  try { status = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { status = {}; }
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(status)); } catch (e) {} };
  const stOf = (en) => status[en] || "";

  const ALL = CHAPTERS.flatMap((c, ci) => c.words.map(w => ({ ko: w[0], en: w[1], pr: w[2], em: w[3], ci })));
  const $ = (id) => document.getElementById(id);
  const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

  // ---------- 화면 전환 ----------
  const SCREENS = ["home", "learn", "quiz", "result"];
  let inside = false; // 홈이 아닌 화면에 있는지 (폰 뒤로가기 처리용)
  function show(name) {
    SCREENS.forEach(s => $(s).hidden = s !== name);
    window.scrollTo(0, 0);
    if (name !== "home" && !inside) { history.pushState({ inside: true }, ""); inside = true; }
  }
  function goHome() {
    if (window.speechSynthesis) speechSynthesis.cancel();
    clearTimeout(quizTimer);
    show("home");
    renderHome();
  }
  document.addEventListener("click", (e) => {
    if (e.target.closest("[data-home]")) { if (inside) history.back(); else goHome(); }
  });
  window.addEventListener("popstate", () => { inside = false; goHome(); });

  // ---------- 홈 ----------
  function renderHome() {
    const done = ALL.filter(w => stOf(w.en) === "done").length;
    const review = ALL.filter(w => stOf(w.en) === "review").length;
    $("summary").innerHTML = `전체 ${ALL.length}개 · <b class="d">완료 ${done}</b> · <b class="r">복습 ${review}</b>`;
    $("reviewAll").hidden = review === 0;
    $("reviewAll").textContent = `🔁 복습 필요 단어 ${review}개 모아 공부하기`;

    $("chapters").innerHTML = CHAPTERS.map((c, i) => {
      const d = c.words.filter(w => stOf(w[1]) === "done").length;
      const r = c.words.filter(w => stOf(w[1]) === "review").length;
      const chips = c.words.map(w => `<span class="chip ${stOf(w[1])}">${w[0].split(" (")[0]} ${w[1]}</span>`).join("");
      return `
        <div class="chapter">
          <div class="ch-head">
            <div class="ch-emoji">${c.emoji}</div>
            <div class="ch-name"><div class="n">${i + 1}장</div><div class="t">${c.title}</div></div>
            <button class="ch-start" data-ch="${i}">시작</button>
          </div>
          <div class="bar"><div class="d" style="width:${d * 10}%"></div><div class="r" style="width:${r * 10}%"></div></div>
          <div class="ch-count">완료 ${d} · 복습 ${r} · 아직 ${10 - d - r}</div>
          <div class="chips">${chips}</div>
        </div>`;
    }).join("");
  }
  $("chapters").addEventListener("click", (e) => {
    const b = e.target.closest("[data-ch]");
    if (b) { const ci = +b.dataset.ch; openLearn(ALL.filter(w => w.ci === ci), `${ci + 1}장 ${CHAPTERS[ci].title}`); }
  });
  $("reviewAll").addEventListener("click", () => {
    const list = ALL.filter(w => stOf(w.en) === "review");
    if (list.length) openLearn(list, "복습 단어");
  });

  // ---------- 배움 (플래시카드) ----------
  let deck = [], idx = 0;
  function openLearn(list, name) {
    deck = list; idx = 0;
    $("where").textContent = name;
    show("learn");
    renderCard();
  }
  function renderCard() {
    const w = deck[idx];
    $("wEmoji").textContent = w.em;
    $("wKo").textContent = w.ko;
    $("wEn").textContent = w.en;
    $("wPr").textContent = `[ ${w.pr} ]`;
    $("pos").textContent = `${idx + 1} / ${deck.length}`;
    $("prev").disabled = idx === 0;
    const last = idx === deck.length - 1;
    $("next").textContent = last ? "퀴즈 풀기 ✏️" : "다음 ▶";
    $("next").classList.toggle("go", last);
    $("dots").innerHTML = deck.length <= 20
      ? deck.map((_, i) => `<span class="dot ${i === idx ? "now" : ""}"></span>`).join("") : "";
  }
  function move(step) {
    const n = idx + step;
    if (n < 0) return;
    if (n >= deck.length) { startQuiz(); return; }
    const card = $("card");
    card.style.opacity = "0";
    card.style.transform = `translateX(${step > 0 ? -40 : 40}px)`;
    setTimeout(() => {
      idx = n; renderCard();
      card.style.transition = "none";
      card.style.transform = `translateX(${step > 0 ? 40 : -40}px)`;
      requestAnimationFrame(() => requestAnimationFrame(() => {
        card.style.transition = "";
        card.style.opacity = "1";
        card.style.transform = "";
      }));
    }, 150);
  }
  $("prev").addEventListener("click", () => move(-1));
  $("next").addEventListener("click", () => move(1));

  let sx = null, sy = null;
  $("card").addEventListener("touchstart", (e) => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
  $("card").addEventListener("touchend", (e) => {
    if (sx === null) return;
    const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    sx = null;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) {
      if (dx < 0 && idx === deck.length - 1) return; // 마지막 카드에서는 버튼으로만 퀴즈 시작
      move(dx < 0 ? 1 : -1);
    }
  });

  // ---------- 소리 ----------
  function speak(text) {
    if (!("speechSynthesis" in window)) { alert("이 폰에서는 소리 기능을 쓸 수 없어요."); return; }
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "en-US"; u.rate = 0.75;
    const v = speechSynthesis.getVoices().find(v => v.lang && v.lang.replace("_", "-").startsWith("en-US"))
           || speechSynthesis.getVoices().find(v => v.lang && v.lang.startsWith("en"));
    if (v) u.voice = v;
    speechSynthesis.speak(u);
  }
  $("speak").addEventListener("click", () => speak(deck[idx].en));

  // ---------- 퀴즈 ----------
  let qList = [], qi = 0, results = [], quizTimer = null, locked = false;
  function startQuiz() {
    qList = shuffle(deck); qi = 0; results = [];
    show("quiz");
    renderQuestion();
  }
  function renderQuestion() {
    locked = false;
    const w = qList[qi];
    $("qPos").textContent = `${qi + 1} / ${qList.length}`;
    $("qEn").textContent = w.en;
    $("feedback").textContent = ""; $("feedback").className = "feedback";
    // 오답 보기: 같은 챕터에서 먼저 고르고, 모자라면 전체에서
    const pool = shuffle(ALL.filter(x => x.en !== w.en && x.ci === w.ci))
      .concat(shuffle(ALL.filter(x => x.en !== w.en && x.ci !== w.ci)));
    const opts = shuffle([w, ...pool.slice(0, 3)]);
    $("choices").innerHTML = opts.map(o => `<button class="choice" data-en="${o.en}">${o.ko}</button>`).join("");
  }
  $("qSpeak").addEventListener("click", () => speak(qList[qi].en));
  $("choices").addEventListener("click", (e) => {
    const b = e.target.closest(".choice");
    if (!b || locked) return;
    locked = true;
    const w = qList[qi];
    const ok = b.dataset.en === w.en;
    status[w.en] = ok ? "done" : "review";
    save();
    results.push({ w, ok });
    $("choices").querySelectorAll(".choice").forEach(c => { if (c.dataset.en === w.en) c.classList.add("right"); });
    if (!ok) b.classList.add("wrong");
    $("feedback").className = "feedback " + (ok ? "ok" : "no");
    $("feedback").textContent = ok ? "⭕ 맞았어요!" : `❌ 정답은 '${w.ko}' 예요`;
    quizTimer = setTimeout(() => {
      qi++;
      if (qi < qList.length) renderQuestion(); else showResult();
    }, ok ? 1000 : 2000);
  });

  // ---------- 결과 ----------
  function showResult() {
    const right = results.filter(r => r.ok).length;
    const total = results.length;
    $("rBig").textContent = right === total ? "🎉" : right >= total / 2 ? "👍" : "💪";
    $("rScore").textContent = `${total}개 중 ${right}개 맞았어요!`;
    $("rList").innerHTML = results.map(r =>
      `<div class="r-item"><span class="mk">${r.ok ? "✅" : "🔁"}</span><span class="tx"><b>${r.w.en}</b> <span>${r.w.ko}</span></span></div>`
    ).join("");
    const wrong = results.filter(r => !r.ok).map(r => r.w);
    $("rRetry").hidden = wrong.length === 0;
    $("rRetry").onclick = () => openLearn(wrong, "틀린 단어");
    show("result");
  }

  renderHome();

  // 오프라인 사용 (https 또는 localhost 에서만 동작)
  if ("serviceWorker" in navigator && window.isSecureContext) {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }
</script>
</body>
</html>
